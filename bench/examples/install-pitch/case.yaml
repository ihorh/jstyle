schema_version: "1.1"
name: install-pitch
plugins: ["../../../plugins/jstyle"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Agent, Skill]
graders:
  # Whether the session loaded the skill. Scored for the skill arm only.
  - name: skill-loaded
    type: tool_used
    tool: Skill
